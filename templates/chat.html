<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<script src="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
<script src="//cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>

<!DOCTYPE html>
<html>

<head>
    <title>Clinical RAG Chatbot</title>

    <link rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
        integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
        crossorigin="anonymous">

    <link rel="stylesheet"
        href="https://use.fontawesome.com/releases/v5.5.0/css/all.css"
        integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU"
        crossorigin="anonymous">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>

    <link rel="stylesheet" type="text/css"
        href="{{ url_for('static', filename='style.css') }}" />

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>

    <div class="container-fluid h-100">
        <div class="row justify-content-center h-100">

            <div class="col-md-8 col-xl-6 chat">

                <div class="card">

                    <div class="card-header msg_head">
                        <div class="d-flex bd-highlight">

                            <div class="img_cont">
                                <img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png"
                                    class="rounded-circle user_img">
                                <span class="online_icon"></span>
                            </div>

                            <div class="user_info">
                                <span>Clinical RAG Assistant</span>
                                <p>Secure Medical Knowledge Base</p>
                            </div>

                        </div>
                    </div>

                    <div id="messageFormeight" class="card-body msg_card_body">
                    </div>

                    <div class="card-footer">
                        <div id="imagePreviewContainer" style="display: none; position: relative; margin-bottom: 10px; padding: 5px; background: rgba(0,0,0,0.2); border-radius: 8px; max-width: 120px;">
                            <img id="imagePreview" src="" style="max-width: 100px; max-height: 100px; border-radius: 6px; display: block;">
                            <button id="clearImageBtn" type="button" style="position: absolute; top: -5px; right: -5px; background: #ff4d4d; color: white; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; line-height: 16px; text-align: center; cursor: pointer; padding: 0;">&times;</button>
                        </div>

                        <form id="messageArea" class="input-group">
    
                            <input type="file" id="imageInput" accept="image/*, application/pdf" style="display: none;" />
                            
                            <div class="input-group-prepend">
                                <button type="button" id="uploadBtn" class="input-group-text attach_btn" style="background-color: rgba(0,0,0,0.3); border: none; color: white;">
                                    <i class="fas fa-paperclip"></i>
                                </button>
                            </div>
                        
                            <input
                                type="text"
                                id="text"
                                name="msg"
                                placeholder="Type your message..."
                                autocomplete="off"
                                class="form-control type_msg"
                                required />
                        
                            <div class="input-group-append">
                                <button type="submit" id="send" class="input-group-text send_btn">
                                    <i class="fas fa-location-arrow"></i>
                                </button>
                            </div>
                            
                        </form>
                    </div>

                </div>

            </div>

        </div>
    </div>

    <script>
        $(document).ready(function () {
            let attachedBase64Image = null;

            // --- Trigger Hidden File Input via Paperclip Click ---
            $("#uploadBtn").on("click", function () {
                $("#imageInput").click();
            });

            // --- Monitor File Input Selection Changes (WITH AUTO-COMPRESSION) ---
            // --- Monitor File Input Selection Changes ---
            $("#imageInput").on("change", function (event) {
                const file = event.target.files[0];
                if (file) {
                    const fileType = file.type;
                    const reader = new FileReader();
                    
                    reader.onload = function (e) {
                        // 📄 PATHWAY A: IF IT IS A PDF DOCUMENT
                        if (fileType === "application/pdf") {
                            attachedBase64Image = e.target.result; // Save raw base64 string
                            
                            // Show a generic PDF icon in the preview instead of an image
                            $("#imagePreview").attr("src", "https://upload.wikimedia.org/wikipedia/commons/8/87/PDF_file_icon.svg");
                            $("#imagePreviewContainer").show();
                            $("#text").removeAttr("required");
                        } 
                        // 📸 PATHWAY B: IF IT IS AN IMAGE
                        else {
                            const img = new Image();
                            img.onload = function() {
                                const canvas = document.createElement("canvas");
                                const MAX_WIDTH = 800; 
                                let scaleSize = 1;
                                if (img.width > MAX_WIDTH) { scaleSize = MAX_WIDTH / img.width; }
                                canvas.width = img.width * scaleSize;
                                canvas.height = img.height * scaleSize;
                                const ctx = canvas.getContext("2d");
                                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                                attachedBase64Image = canvas.toDataURL("image/jpeg", 0.7);
                                $("#imagePreview").attr("src", attachedBase64Image);
                                $("#imagePreviewContainer").show();
                                $("#text").removeAttr("required");
                            }
                            img.src = e.target.result;
                        }
                    };
                    reader.readAsDataURL(file);
                }
            });

            // --- Clear Attached Image Selection ---
            $("#clearImageBtn").on("click", function () {
                attachedBase64Image = null;
                $("#imageInput").val("");
                $("#imagePreviewContainer").hide();
                $("#imagePreview").attr("src", "");
                $("#text").attr("required", true);
            });

            // --- Unified Submission Pipeline ---
            $("#messageArea").on("submit", async function (event) {
                event.preventDefault();

                const date = new Date();
                const hour = date.getHours();
                const minute = date.getMinutes();
                const str_time = hour + ":" + (minute < 10 ? "0" + minute : minute);

                var rawText = $("#text").val();
                
                // Construct Display payload inside user side message bubble
                var userDisplayContent = rawText;
                if (attachedBase64Image) {
                    userDisplayContent = `<img src="${attachedBase64Image}" style="max-width: 150px; display: block; border-radius: 6px; margin-bottom: 5px;"/>` + rawText;
                }

                // Append User Message bubble to DOM
                var userHtml =
                    '<div class="d-flex justify-content-end mb-4">' +
                    '<div class="msg_cotainer_send">' +
                    userDisplayContent +
                    '<span class="msg_time_send">' + str_time + '</span>' +
                    '</div>' +
                    '<div class="img_cont_msg">' +
                    '<img src="https://i.ibb.co/d5b84Xw/Untitled-design.png" class="rounded-circle user_img_msg">' +
                    '</div>' +
                    '</div>';

                $("#text").val("");
                $("#messageFormeight").append(userHtml);

                var chatBody = $("#messageFormeight");
                chatBody.scrollTop(chatBody[0].scrollHeight);

                // Initialize Bot Placeholder Bubble with unique DOM markers
                var uniqueId = "bot_" + Date.now();
                var botHtml =
                    '<div class="d-flex justify-content-start mb-4">' +
                    '<div class="img_cont_msg">' +
                    '<img src="https://www.prdistribution.com/spirit/uploads/pressreleases/2019/newsreleases/d83341deb75c4c4f6b113f27b1e42cd8-chatbot-florence-already-helps-thousands-of-patients-to-remember-their-medication.png" class="rounded-circle user_img_msg">' +
                    '</div>' +
                    '<div class="msg_cotainer" style="max-width:75%; overflow-x:auto;">' +
                    '<div id="' + uniqueId + '"></div>' +
                    '<div id="' + uniqueId + '_cites"></div>' +
                    '<span class="msg_time">' + str_time + '</span>' +
                    '</div>' +
                    '</div>';

                $("#messageFormeight").append(botHtml);
                chatBody.scrollTop(chatBody[0].scrollHeight);

                // Compile Multipart Form Payload
                var formData = new FormData();
                formData.append("msg", rawText);
                formData.append("session_id", "default_user");
                if (attachedBase64Image) {
                    formData.append("image", attachedBase64Image);
                }

                // Reset file attachment states instantly in UI post compilation
                $("#clearImageBtn").click();

                try {
                    const response = await fetch("/get", {
                        method: "POST",
                        body: formData
                    });

                    // --- UPGRADED ERROR CATCHER ---
                    if (!response.ok && response.status !== 200) {
                        try {
                            const errorData = await response.json();
                            document.getElementById(uniqueId).innerHTML = marked.parse(errorData.answer);
                        } catch (parseError) {
                            // If Flask throws a raw 500 Server Error page, catch it here!
                            document.getElementById(uniqueId).innerHTML = `<span style="color:#ff6b6b;"><strong>Server Error:</strong> Please check your Python terminal for the exact error trace.</span>`;
                        }
                        chatBody.scrollTop(chatBody[0].scrollHeight);
                        return;
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();

                    let accumulatedText = "";
                    let citations = [];
                    let tokenCount = 0;

                    while (true) {
                        const { value, done } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split("\n");

                        for (const line of lines) {
                            if (line.startsWith("data: ")) {
                                try {
                                    const payload = JSON.parse(line.substring(6));

                                    if (payload.type === "token") {
                                        accumulatedText += payload.data;
                                        tokenCount++;

                                        if (tokenCount % 5 === 0) {
                                            document.getElementById(uniqueId).innerHTML =
                                                marked.parse(accumulatedText);
                                        }
                                    } else if (payload.type === "citations") {
                                        citations = payload.data;
                                    } else if (payload.type === "guardrail_trigger") {
                                        document.getElementById(uniqueId).innerHTML =
                                            `<span style="color:#ff6b6b;"><strong>Safety Alert:</strong> ${payload.data}</span>`;
                                    }
                                } catch (e) {
                                    // Handle string splitting margins safely
                                }
                            }
                        }
                    }

                    // Final Render Execution
                    document.getElementById(uniqueId).innerHTML = marked.parse(accumulatedText);

                    // Citations Render Loop
                    if (citations.length > 0) {
                        let citeHtml =
                            '<div style="margin-top:10px;font-size:0.85em;border-top:1px dashed rgba(255,255,255,0.3);padding-top:5px;color:#e0e0e0;">' +
                            '<strong>Sources:</strong><br>';

                        citations.forEach(function (cite) {
                            citeHtml +=
                                '<span style="background:rgba(0,0,0,0.2);padding:2px 6px;margin:2px 2px 0 0;border-radius:4px;display:inline-block;">' +
                                '📄 ' + cite.file + ' (Pg. ' + cite.page + ')' +
                                '</span>';
                        });

                        citeHtml += "</div>";
                        document.getElementById(uniqueId + "_cites").innerHTML = citeHtml;
                    }

                    chatBody.scrollTop(chatBody[0].scrollHeight);

                } catch (error) {
                    document.getElementById(uniqueId).innerHTML = "<i>Connection error.</i>";
                }
            });
        });
    </script>

</body>

</html>
